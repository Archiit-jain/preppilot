name: Android APK

# Builds an installable APK through EAS Build.
#
# Run it from the Actions tab: "Android APK" → "Run workflow" → pick a profile.
#
# Requires one repository secret:
#   EXPO_TOKEN — a personal access token from https://expo.dev/settings/access-tokens
#
# The preview-live profile additionally needs the Supabase credentials, which are
# NOT stored in this repository. They live as EAS environment variables on the
# Expo project, because EXPO_PUBLIC_* values are inlined while the build runs on
# EAS servers, where a GitHub secret is not visible. Create them once with:
#
#   eas env:create --name EXPO_PUBLIC_SUPABASE_URL      --value <url> --visibility sensitive
#   eas env:create --name EXPO_PUBLIC_SUPABASE_ANON_KEY --value <key> --visibility sensitive

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        type: choice
        required: true
        default: preview-live
        options:
          - preview-live
          - preview

jobs:
  build:
    name: Build ${{ inputs.profile }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check the Expo token is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # A build takes roughly 15 minutes, so the queue is worth confirming before
      # waiting on it.
      - name: Build the APK
        working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Publish the download link
        if: success()
        working-directory: apps/mobile
        run: |
          URL=$(eas build:list --platform android --limit 1 --non-interactive --json \
                | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s)[0]||{};console.log(b.artifacts?.buildUrl||b.artifacts?.applicationArchiveUrl||'')})")
          {
            echo "## APK ready"
            echo ""
            echo "Profile: \`${{ inputs.profile }}\`"
            echo ""
            if [ -n "$URL" ]; then
              echo "[Download the APK]($URL)"
            else
              echo "Build succeeded. Find the artifact at <https://expo.dev/accounts/sillyguysolutions/projects/preppilot/builds>."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
