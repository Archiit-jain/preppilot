<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your email for PrepPilot</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f5f7">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f5f7">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background-color: #ffffff; border-radius: 12px"
          >
            <tr>
              <td style="padding: 32px 32px 8px 32px; font-family: Arial, Helvetica, sans-serif">
                <p style="margin: 0; font-size: 22px; font-weight: bold; color: #2563EB">PrepPilot</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 0 32px; font-family: Arial, Helvetica, sans-serif; color: #1f2937">
                <h1 style="margin: 0 0 12px 0; font-size: 20px">Verify your email</h1>
                <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 22px">
                  Thanks for signing up. Tap the button below to confirm your email address and start
                  tracking your preparation in PrepPilot.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 32px 24px 32px">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    padding: 12px 28px;
                    background-color: #2563EB;
                    color: #ffffff;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 15px;
                    font-weight: bold;
                    text-decoration: none;
                    border-radius: 8px;
                  "
                  >Verify email</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 32px 32px 32px;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 13px;
                  line-height: 20px;
                  color: #6b7280;
                "
              >
                <p style="margin: 0 0 8px 0">Open this email on the phone where PrepPilot is installed.</p>
                <p style="margin: 0">If you didn't create a PrepPilot account, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
